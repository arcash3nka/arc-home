<!-- ═══ экран загрузки ═══════════════════════════════════════════════════ -->
<div class="boot" id="boot">
	<pre class="boot-log" id="boot-log"></pre>
	<div class="boot-hint" id="boot-hint">press any key to skip</div>
</div>

<!-- ═══ страховка ════════════════════════════════════════════════════════
     ES-модули запрещено грузить с file:// — это политика браузера, а не
     поломка сайта. Safari при этом просто молча ничего не делает, и
     посетитель остаётся смотреть на застывший экран загрузки. Через две
     секунды после старта проверяем, ожил ли интерфейс, и если нет —
     объясняем, что произошло, вместо тишины.
     Скрипт намеренно классический, без type=module: он должен работать
     ровно в тех условиях, где модули не работают.
═══════════════════════════════════════════════════════════════════════ -->
<script>
(function () {
	var LOCAL = location.protocol === 'file:';
	setTimeout(function () {
		if (document.documentElement.getAttribute('data-booted') === '1') return;

		var log = document.getElementById('boot-log');
		var hint = document.getElementById('boot-hint');
		if (!log) return;

		log.textContent = LOCAL
			? '══════════════════════════════════════════\n'
				+ ' modules blocked on file://\n'
				+ '══════════════════════════════════════════\n\n'
				+ 'Браузер не даёт странице грузить модули, когда её\n'
				+ 'открыли двойным кликом по файлу. Это правило\n'
				+ 'безопасности, сайт тут ни при чём.\n\n'
				+ 'Запусти в папке сайта:\n\n'
				+ '  python3 -m http.server 5199 --bind 127.0.0.1\n\n'
				+ 'и открой http://127.0.0.1:5199\n\n'
				+ 'На GitHub Pages всё работает само.'
			: '══════════════════════════════════════════\n'
				+ ' boot failed\n'
				+ '══════════════════════════════════════════\n\n'
				+ 'Скрипты не загрузились. Проверь консоль браузера\n'
				+ 'и что рядом с index.html лежат папки src/ и data/.';

		if (hint) hint.textContent = '';
		document.getElementById('boot').style.cursor = 'default';
	}, 2000);
})();
</script>
